<!-- templates/Swaram/live_progress_bar.html -->
<div id="liveProgressContainer" class="container-fluid bg-dark text-white py-2 border-bottom" style="position: sticky; top: 0; z-index: 1050;">
    <div class="container">
        <div class="row align-items-center">
            
            <!-- LEFT: Motivation & Bar -->
            <div class="col-md-7">
                <div class="d-flex justify-content-between mb-1">
                    <strong class="text-warning" id="liveMessage">🚀 Loading race data...</strong>
                    <small id="liveTimer" class="text-muted">Live</small>
                </div>
                <div class="progress" style="height: 20px; background-color: #333;">
                    <div id="liveProgressBar" class="progress-bar bg-gradient-primary progress-bar-striped progress-bar-animated" 
                         role="progressbar" style="width: 0%">
                        <span id="liveProgressText">0 Files Today</span>
                    </div>
                </div>
            </div>
            
            <!-- RIGHT: Leaderboard -->
            <div class="col-md-5">
                <div class="d-flex align-items-center justify-content-end" id="activeUsersList">
                    <!-- Users injected via JS -->
                </div>
            </div>
        </div>
    </div>
</div>

<style>
    .bg-gradient-primary { background: linear-gradient(90deg, #4facfe 0%, #00f2fe 100%); }
    .user-badge {
        font-size: 0.8rem;
        padding: 4px 10px;
        margin-left: 5px;
        border-radius: 15px;
        background: rgba(255,255,255,0.1);
        border: 1px solid rgba(255,255,255,0.2);
        white-space: nowrap;
    }
    .user-badge.me { background: rgba(79, 172, 254, 0.3); border-color: #4facfe; font-weight: bold; }
    .user-badge.gold { border-color: gold; color: gold; }
</style>

<script>
const MY_USER_ID = {{ request.user.id|default:"null" }};

function updateLiveProgress() {
    fetch('/live_progress/')
        .then(response => response.json())
        .then(data => {
            // 1. Update Bar (Visuals)
            const bar = document.getElementById('liveProgressBar');
            bar.style.width = data.overall_percentage + '%';
            document.getElementById('liveProgressText').innerText = data.total_saved + " Verified Today";

            // 2. Render Users (Right Side)
            const list = document.getElementById('activeUsersList');
            let html = '';
            
            // Show top 3 + Me
            data.active_users.slice(0, 3).forEach((u, idx) => {
                let extraClass = '';
                if(u.id === MY_USER_ID) extraClass += ' me';
                if(idx === 0) extraClass += ' gold';
                
                let icon = idx === 0 ? '👑' : '👤';
                html += `<div class="user-badge ${extraClass}">${icon} ${u.username}: ${u.count}</div>`;
            });
            list.innerHTML = html;

            // 3. Stable Motivation Logic
            const msgEl = document.getElementById('liveMessage');
            const ctx = data.user_context;

            if (!ctx.is_authenticated) {
                msgEl.innerText = "🔒 Login to join the leaderboard";
            } else if (ctx.my_rank === 1) {
                msgEl.innerText = `🏆 You are #1! (Leading with ${data.active_users[0].count})`;
            } else if (ctx.rival) {
                const gap = ctx.rival.count - (data.active_users.find(u => u.id === MY_USER_ID)?.count || 0);
                msgEl.innerText = `⚔️ Beat ${ctx.rival.username}! (Gap: ${gap})`;
            } else {
                msgEl.innerText = "🚀 Verify a file to enter the race!";
            }
        })
        .catch(err => console.log("Live stats silent error")); // Silent fail to not annoy user
}

// Update every 4 seconds
setInterval(updateLiveProgress, 4000);
updateLiveProgress(); // Initial call
</script>
