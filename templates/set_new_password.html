<div class="card shadow-sm border-0">
    <div class="card-body p-4">
        <h4 class="card-title text-center mb-4 text-primary">Reset Password</h4>

        <form method="POST" action="{% url 'set_new_password' %}">
            {% csrf_token %}
            <input type="hidden" name="email" value="{{ email }}">

            <!-- OTP Field -->
            <div class="mb-3">
                <label for="otp" class="form-label fw-semibold">Enter OTP</label>
                <input type="text" 
                       class="form-control form-control-lg text-center" 
                       id="otp" 
                       name="otp" 
                       maxlength="6" 
                       pattern="\d{6}" 
                       placeholder="123456" 
                       required>
                <div class="form-text">Check your email for the 6-digit code</div>
            </div>

            <!-- New Password -->
            <div class="mb-3">
                <label for="password" class="form-label fw-semibold">New Password</label>
                <div class="input-group">
                    <input type="password" 
                           class="form-control form-control-lg" 
                           id="password" 
                           name="password" 
                           placeholder="Enter new password" 
                           required>
                    <button type="button" class="btn btn-outline-secondary" id="togglePassword">
                        <i class="fas fa-eye"></i>
                    </button>
                </div>
            </div>

            <!-- Confirm Password -->
            <div class="mb-4">
                <label for="confirm_password" class="form-label fw-semibold">Confirm Password</label>
                <input type="password" 
                       class="form-control form-control-lg" 
                       id="confirm_password" 
                       name="confirm_password" 
                       placeholder="Confirm your password" 
                       required>
            </div>

            <!-- Submit Button -->
            <button type="submit" 
                    name="reset_password" 
                    value="1"
                    class="btn btn-primary btn-lg w-100 fw-semibold">
                Reset Password
            </button>
        </form>
    </div>
</div>

<!-- Optional: Password Toggle Script -->
<script>
document.getElementById('togglePassword')?.addEventListener('click', function () {
    const passwordField = document.getElementById('password');
    const icon = this.querySelector('i');
    if (passwordField.type === 'password') {
        passwordField.type = 'text';
        icon.classList.replace('fa-eye', 'fa-eye-slash');
    } else {
        passwordField.type = 'password';
        icon.classList.replace('fa-eye-slash', 'fa-eye');
    }
});
</script>
